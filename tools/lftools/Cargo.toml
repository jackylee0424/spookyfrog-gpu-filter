[package]
name = "lftools"
version = "0.2.0"
edition = "2021"
description = "Stream-binding helpers (Fiat-Shamir prefix checkpoint, XOF words) for the Leapfrog GPU prefilter"
publish = false

[[bin]]
name = "lftools"
path = "src/main.rs"

[dependencies]
sha3 = "0.10.8"
zstd = "0.13.3"

[profile.release]
opt-level = 3
debug = false
